name: Build firmware and publish Web Flasher

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "boards/**"
      - "platformio.ini"
      - "partitions.csv"
      - "webflasher/**"
      - "tools/**"
      - ".github/workflows/build-and-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Verify project contracts
        run: node tools/check-project.mjs

      - name: Build firmware
        run: pio run -e t_embed_ai

      - name: Determine release version
        id: version
        shell: bash
        run: echo "value=0.1.0+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create Web Flasher release package
        shell: bash
        run: |
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          node tools/package-webflasher.mjs --version "${{ steps.version.outputs.value }}" --boot-app0 "$BOOT_APP0"

      - name: Verify Web Flasher assets
        run: |
          node --check webflasher/app.js
          node --check tools/package-webflasher.mjs
          test -f webflasher/firmware/manifest.json

      - name: Upload firmware package
        uses: actions/upload-artifact@v4
        with:
          name: t-embed-ai-${{ steps.version.outputs.value }}
          path: webflasher/firmware/releases/${{ steps.version.outputs.value }}/
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webflasher

  deploy:
    name: Deploy Web Flasher
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
