; T-Embed AI — reproducible firmware build for the LILYGO T-Embed CC1101 Plus.
[platformio]
default_envs = t_embed_ai
boards_dir = boards

[env:t_embed_ai]
platform = espressif32@6.13.0
board = t_embed_ai
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D USER_SETUP_LOADED
    -include ${PROJECT_INCLUDE_DIR}/TftSetup.h
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    fastled/FastLED@^3.9.12
lib_compat_mode = strict
check_tool = cppcheck

